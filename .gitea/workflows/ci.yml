name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend build
        run: npm run build

      - name: Run frontend Vitest tests with coverage
        run: npm run test:ui:coverage

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: src/frontend/coverage

      - name: Run Firestore rules tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-member4-roles "npm run test:rules"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke test
        run: npm run test:e2e

  backend:
    name: Backend build and coverage tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
          for i in {1..30}; do
            if sudo -u postgres pg_isready; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Create disposable backend test database
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE f1analytics_test LOGIN PASSWORD 'f1analytics_test'"
          sudo -u postgres createdb --owner=f1analytics_test f1analytics_test

      - name: Verify backend test database connection
        env:
          TEST_DATABASE_URL: postgres://f1analytics_test:f1analytics_test@127.0.0.1:5432/f1analytics_test
        run: |
          for i in {1..30}; do
            if psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend test database connection did not become ready"
          exit 1

      - name: Run backend build
        run: npm run build

      - name: Run backend tests with coverage
        env:
          TEST_DATABASE_URL: postgres://f1analytics_test:f1analytics_test@127.0.0.1:5432/f1analytics_test
        run: |
          test -n "$TEST_DATABASE_URL"
          npm run test:coverage

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: src/backend/coverage

  database:
    name: Fresh database validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
          for i in {1..30}; do
            if sudo -u postgres pg_isready; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Create fresh CI database
        run: sudo -u postgres createdb f1analytics_ci

      - name: Build fresh database from schema.sql
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d f1analytics_ci -f database/schema.sql

      - name: Load development seed
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d f1analytics_ci -f database/seed.sql

      - name: Verify required schema objects
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d f1analytics_ci -f database/verify_schema.sql

  docs:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

  deploy_railway:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - database
      - docs
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway up             --ci             --project "$RAILWAY_PROJECT_ID"             --environment production             --service "$RAILWAY_SERVICE_ID"             --message "Gitea CI ${{ gitea.sha }}"
