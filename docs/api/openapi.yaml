openapi: 3.1.0

# =============================================================================
# F1 Sport Analytics — OpenAPI description of the API **as implemented**.
#
# Generated by reading, at commit f34140f (constructors route added since):
#   src/backend/src/app.ts
#   src/backend/src/routes/{index,health,drivers,constructors,exports,races,submissions,users}.routes.ts
#   src/backend/src/controllers/*.ts
#   src/backend/src/models/*.model.ts
#   src/backend/src/services/{driverStatistics,constructorStatistics,raceStatistics,pointsTable}.ts
#   src/backend/src/types/*.types.ts
#   src/backend/src/utils/{pagination,queryValidation}.ts
#   src/backend/src/middleware/{ApiError,errorHandler,notFoundHandler,
#                               authenticate,authorization}.ts
#   docs/api-design.md
#
# SCOPE: only routes actually mounted on the Express app are described. The
# contract in docs/api-design.md is broader than the running server; every
# place the two disagree is recorded inline as a `TODO(discrepancy)` comment
# rather than normalised away.
#
# TODO(discrepancy): docs/api-design.md §8 specifies five identity/admin
#   endpoints — GET /users/me, PATCH /users/me/submitter-request,
#   DELETE /users/me, GET /admin/submitter-requests,
#   PATCH /admin/users/{user_id}. Only DELETE /users/me is mounted
#   (routes/users.routes.ts) and it is described below. The frontend still
#   talks to Firestore directly for the other four (auth/AuthContext.tsx,
#   pages/Auth/Account.tsx, pages/Admin/SubmitterRequests.tsx).
#
# TODO(discrepancy): docs/api-design.md §13 labels the write endpoints (§7)
#   and auth (§8) as "Sprint 2 — not implemented yet". The four /submissions
#   routes ARE implemented and mounted. The doc's own sprint framing is stale.
# =============================================================================

info:
  title: F1 Sport Analytics API
  version: "1.0.0"
  summary: Event-sourced Formula 1 analytics — read endpoints plus a submission workflow.
  description: |
    Every endpoint is backed by PostgreSQL (`pg` pool over `DATABASE_URL`).
    The read models issue hand-written SQL; `models/sampleData.ts` still
    exists but no model reads it, and the read path no longer touches
    `data/sample/*.json` at runtime.

    Race and driver data therefore reflects whatever has been loaded into the
    database — `database/seed.sql` for the sample race, and the Jolpica
    ingestion (`npm run ingest`, see docs/ingestion/jolpica-ingestion.md) for
    full seasons. Response *shapes* are fixed; row counts and coverage are
    not, so the examples below are illustrative rather than guaranteed.

    The `/submissions` and `/users` endpoints are the only routes requiring
    authentication.

    Field naming is snake_case end to end, per docs/api-design.md §3.

servers:
  # Relative, and deliberately first. Swagger UI resolves it against whatever
  # host is serving /api/docs, so "Try it out" targets the deployed API when
  # read on the deployed host and a local server when read on localhost. Being
  # same-origin, it is also the only entry that never involves CORS.
  - url: /api/v1
    description: This server — all routes are mounted under this prefix by app.ts.

  # The deployed backend. Verified live: GET /api/v1/health returns
  # {"data":{"status":"ok"},"meta":{}}. Selecting this entry while reading the
  # docs on another origin (e.g. a local server) is a cross-origin request, so
  # that origin must be listed in the deployed CORS_ORIGINS for "Try it out"
  # to succeed.
  - url: https://f1-sport-analytics-api-production.up.railway.app/api/v1
    description: Production (Railway).

tags:
  - name: health
  - name: chat
  - name: constructors
  - name: drivers
  - name: exports
  - name: races
  - name: statistics
  - name: submissions
  - name: users

# Applied to every operation by default. Each public read endpoint overrides
# this with an explicit `security: []` — docs/api-design.md §8 confirms the
# drivers/races/laps/events routes "don't require the header at all".
security:
  - firebaseIdToken: []

# =============================================================================
paths:
# =============================================================================

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe.
      description: |
        Static response. Reads nothing — no file, no database.

        TODO(discrepancy): this endpoint exists in
        routes/health.routes.ts and is covered by
        controllers/health.controller.test.ts, but is documented nowhere in
        docs/api-design.md. The doc's endpoint inventory is incomplete.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [status]
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        const: ok
                  meta:
                    $ref: "#/components/schemas/EmptyMeta"
              example:
                data: { status: ok }
                meta: {}

  # ---------------------------------------------------------------------------
  /chat:
    post:
      tags: [chat]
      operationId: postChat
      summary: Ask the F1 assistant a question about this app's data.
      description: |
        Mounted by `routes/chat.routes.ts`; covered by
        `routes/chat.routes.test.ts`. Public: no token is required.

        An LLM (Groq, falling back to Gemini on a 429, a 5xx or a 15-second
        timeout; see docs/third-party-services.md) answers using only
        whitelisted, read-only tools that call the same code as this API
        (`chat/tools.ts`): search_drivers, search_races, get_driver_stats,
        get_constructor_standings, get_race_summary, get_race_events and
        get_export_link. The model never supplies statistics itself.

        Up to 3 tool rounds run, then the model must answer in text. Only
        the 2025 season has data; when no season is named the assistant uses
        2025 and says so.

        Rate limited in memory per process (`middleware/rateLimit.ts`): 10
        requests per minute per client IP and 800 per UTC day overall.
        Requests over either limit get 429 with a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            example:
              messages:
                - role: user
                  content: How many podiums did Oscar Piastri get?
      responses:
        "200":
          description: The assistant's reply.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/ChatReply" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
              example:
                data:
                  reply: "Using the 2025 season: Oscar Piastri has 1 podium in our data."
                  tools_used: [search_drivers, get_driver_stats]
                meta: {}
        "400": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: |
            `RATE_LIMITED`: more than 10 requests in a minute from this
            client, or the daily cap of 800 requests is reached.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many requests. Please wait a minute and try again.
        "502":
          description: |
            `BAD_GATEWAY`: every configured LLM provider failed or timed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              example:
                error:
                  code: BAD_GATEWAY
                  message: The chat assistant is temporarily unavailable. Please try again later.
        "503":
          description: |
            `SERVICE_UNAVAILABLE`: neither `GROQ_API_KEY` nor
            `GEMINI_API_KEY` is configured on the server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The chat assistant is not configured.

  # ---------------------------------------------------------------------------
  /constructors/{constructor_id}/stats:
    get:
      tags: [constructors, statistics]
      operationId: getConstructorStats
      summary: Derived per-season constructor statistics.
      description: |
        Computed by the pure function `services/constructorStatistics.ts`,
        which sums the season's `race_results` rows belonging to this
        constructor, grouped by each row's own `race_results.constructor_id`
        — docs/f1-statistics.md §3. Rows are read by
        `models/constructors.model.ts` `findSeasonPointRows`, which covers
        every `RACE` session in the season.

        `points` is the documented exception to "statistics are derived"
        (docs/ingestion/jolpica-ingestion.md §4.2): it is an ingested
        published fact that already applies the era, sprint and half-point
        rules the derived scale does not implement, same as
        `DriverStatistics.points` — see that schema's description for the
        full rule. The sum is computed per request; no total is stored.

        Team attribution is per race, not per season: because each result row
        records the constructor that driver drove for in that race, a driver
        who changed teams mid-season has each race's points credited to the
        team they actually drove for. `driver_constructor_links` is not
        consulted here — it is season-level with no date range, so it could
        not express that, and a constructor with no link rows reported no
        points despite having results.

        `null` means no result rows exist for this constructor that season.
        `0` means rows exist but total nothing — a real, scoreless season.
      security: []
      parameters:
        - $ref: "#/components/parameters/ConstructorId"
        - name: season
          in: query
          required: true
          description: |
            Required. A four-digit season, the same rule as
            `/drivers/{driver_id}/stats` and `/export`; anything else (e.g.
            `?season=abc`) is a 400 VALIDATION_ERROR. A well-formed season
            with no matching sessions returns 200 with `points: null` rather
            than 404.
          schema:
            type: string
            pattern: "^\\d{4}$"
          example: "2025"
      responses:
        "200":
          description: Derived season statistics.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/ConstructorStatistics" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  /drivers:
    get:
      tags: [drivers]
      operationId: listDrivers
      summary: Paginated driver list.
      description: |
        Source: the `drivers` table via `models/drivers.model.ts`, ordered by
        `driver_id`. `constructor_id` and `constructor_name` come from a join
        through `driver_constructor_links` to `constructors`, matching
        docs/api-design.md §4.1.

        A driver's team is resolved as their **most recent season's** link
        (`DISTINCT ON (driver_id) … ORDER BY season_id DESC`), so a driver who
        has changed team across seasons reports the latest one.

        NOTE: the link join is an INNER join, so a driver row with no
        `driver_constructor_links` entry does not appear in this list at all.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPageDefault20"
        - name: constructor_id
          in: query
          required: false
          description: |
            Exact match, case-insensitive. An empty value (`?constructor_id=`)
            is treated as "no filter", not a validation error
            (utils/queryValidation.ts `optionalFilter`).
          schema: { type: string }
          example: MCL
        - name: nationality
          in: query
          required: false
          description: Exact match, case-insensitive. Empty value ignored.
          schema: { type: string }
          example: Australian
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive substring match against `given_name`,
            `family_name`, **and** the combined `"given family"` string.

            TODO(discrepancy): docs/api-design.md §6 documents `search` as
            matching "`given_name`/`family_name`" only. The implementation
            (models/drivers.model.ts) additionally matches the concatenated
            full name, so `?search=max verstappen` returns a result the
            documented behaviour would not.
          schema: { type: string }
      responses:
        "200":
          description: |
            A page of drivers. A `page` beyond `total_pages` yields an empty
            `data` array with HTTP 200, per docs §5.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DriverRecord" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /drivers/{driver_id}:
    get:
      tags: [drivers]
      operationId: getDriver
      summary: Single driver.
      security: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
      responses:
        "200":
          description: The driver.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DriverRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /drivers/{driver_id}/stats:
    get:
      tags: [drivers, statistics]
      operationId: getDriverStats
      summary: Derived per-season driver statistics.
      description: |
        Computed by the pure function `services/driverStatistics.ts` over the
        season's laps and events, read from PostgreSQL. Nothing is read from a
        stored total.

        Only `RACE` sessions count as races entered. `QUALIFYING` sessions for
        the same grand prix are loaded as supporting input only: their final
        `LAP_COMPLETED` positions supply the starting grid used by
        `positions_gained_lost_avg`. A race with no qualifying data simply
        contributes nothing to that average.

        Coverage depends on what is loaded in the database. A race whose lap
        log has never been ingested still counts toward `races_entered`, and
        contributes `points`, finishing position (`wins`, `podiums`,
        `average_finish_position`), grid position and the fastest-lap flag
        from its `race_results` rows as fallbacks. It cannot contribute
        `average_race_pace_ms`, which needs lap times.
      security: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
        - name: season
          in: query
          required: true
          description: |
            Required. A four-digit season (`utils/queryValidation.ts`
            `seasonParam`); anything else, e.g. `?season=abc`, is a 400
            VALIDATION_ERROR.

            TODO(discrepancy): docs/api-design.md §6 marks `season` required
            but specifies no behaviour for a well-formed season with no data.
            The implementation returns 200 with `races_entered: 0` rather than
            404.
          schema:
            type: string
            pattern: "^\\d{4}$"
          example: "2025"
      responses:
        "200":
          description: Derived season statistics.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DriverStatistics" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  /export/{dataset}:
    get:
      tags: [exports]
      operationId: exportDataset
      summary: Download a whole dataset as CSV or JSON.
      description: |
        Returns the FULL filtered dataset in one response — no pagination.
        Each dataset is read with a single SQL query in
        `models/exports.model.ts`; the CSV body is written by the pure
        `utils/csv.ts` `toCsv()` (RFC 4180: CRLF records, fields containing a
        comma, quote or newline are quoted with embedded quotes doubled,
        `null` written as an empty field).

        Rows are source records, not statistics — nothing is aggregated.
        `results.points` is the per-session `race_results.points` value as
        ingested from Jolpica (docs/ingestion/jolpica-ingestion.md §4.2).

        Both formats are sent with `Content-Disposition: attachment;
        filename="f1-<dataset>-<season|all>.<format>"`, so a browser link
        saves a file rather than rendering it. Column meanings are in the
        Datasets page of the project docs (docs/datasets.md).
      security: []
      parameters:
        - name: dataset
          in: path
          required: true
          description: |
            One of the five datasets. Anything else is a 400
            VALIDATION_ERROR (not a 404).
          schema:
            type: string
            enum: [races, drivers, constructors, results, laps]
          example: results
        - name: format
          in: query
          required: false
          description: Strict enum, lowercase only. Defaults to `json`.
          schema:
            type: string
            enum: [csv, json]
            default: json
        - name: season
          in: query
          required: false
          description: |
            A four-digit season, e.g. `2025`. **Required** for `results` and
            `laps`; an optional filter for `races`, `drivers` and
            `constructors`. An empty value (`?season=`) counts as omitted.
            A non-four-digit value is a 400 VALIDATION_ERROR. An unknown
            season returns 200 with no rows.

            - `drivers` with a season: drivers linked to a team that season,
              with that season's team. Without: every linked driver with
              their latest team, as `GET /drivers` returns.
            - `constructors` with a season: teams with a
              `driver_constructor_links` row OR a `race_results` row that
              season.
          schema:
            type: string
            pattern: "^\\d{4}$"
          example: "2025"
      responses:
        "200":
          description: The whole dataset.
          headers:
            Content-Disposition:
              description: Always an attachment.
              schema:
                type: string
                example: attachment; filename="f1-results-2025.csv"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Row shape depends on `dataset`.
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/RaceListItem"
                        - $ref: "#/components/schemas/DriverRecord"
                        - $ref: "#/components/schemas/ConstructorRecord"
                        - $ref: "#/components/schemas/ResultExportRow"
                        - $ref: "#/components/schemas/LapExportRow"
                  meta: { $ref: "#/components/schemas/ExportMeta" }
              example:
                data:
                  - season_id: "2025"
                    round: 13
                    grand_prix_id: 2025_R13
                    race_name: Belgian Grand Prix
                    session_id: 2025_R13_RACE
                    session_type: RACE
                    position: 1
                    driver_id: PIA
                    constructor_id: MCL
                    grid_position: 2
                    laps_completed: 44
                    pit_stops: 1
                    status: FINISHED
                    points: 25
                    gap_to_winner_ms: 0
                    fastest_lap_rank: null
                    fastest_lap_number: null
                    fastest_lap_time_ms: null
                meta:
                  dataset: results
                  season: "2025"
                  row_count: 1
                  generated_at: "2026-09-28T12:00:00.000Z"
            text/csv:
              schema:
                type: string
                description: |
                  A header row naming every column, then one CRLF-terminated
                  record per row. The header is present even when there are
                  no rows. Content-Type is `text/csv; charset=utf-8`.
              example: "grand_prix_id,season_id,round,race_name,circuit_id,circuit_name,locality,country,date,has_sprint,has_results\r\n2025_R13,2025,13,Belgian Grand Prix,spa,Circuit de Spa-Francorchamps,Spa,Belgium,2025-07-27,true,true\r\n"
        "400":
          description: |
            Unknown dataset, unsupported format, malformed season, or a
            missing season for `results`/`laps`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              examples:
                unknownDataset:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: "Unknown dataset 'pit_stops'. Expected one of: races, drivers, constructors, results, laps."
                missingSeason:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: "Invalid query parameter 'season': required for the 'results' dataset"

  /races:
    get:
      tags: [races]
      operationId: listRaces
      summary: Paginated race list.
      description: |
        Source: the `grand_prix` table joined to `circuits` via
        `models/races.model.ts`, ordered by `season_id` descending then
        `round`.

        `has_results` is computed per row by checking whether any `sessions`
        row exists for that race. It is therefore `true` for every race a
        season ingest has loaded, and `false` for a scheduled round with no
        session yet.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPageDefault20"
        - name: season
          in: query
          required: false
          description: |
            Exact match against the season id. Note the sample data holds a
            single season, so any value other than `2025` returns an empty
            page.
          schema: { type: string }
          example: "2025"
        - name: has_sprint
          in: query
          required: false
          description: |
            Strict enum. Only the literal strings `true` and `false` are
            accepted; anything else (`1`, `TRUE`, `yes`) is a 400
            VALIDATION_ERROR.

            TODO(discrepancy): docs/api-design.md §6 writes this as
            "`has_sprint` (`true`/`false`)" without stating that other
            truthy spellings are rejected rather than coerced.
          schema:
            type: string
            enum: ["true", "false"]
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive substring match against `race_name`, `country`
            and `circuit_name`. Empty value ignored.
          schema: { type: string }
      responses:
        "200":
          description: A page of races.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RaceListItem" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /races/{grand_prix_id}:
    get:
      tags: [races]
      operationId: getRace
      summary: Single race, with the weekend's sessions.
      security: []
      parameters:
        - $ref: "#/components/parameters/GrandPrixId"
      responses:
        "200":
          description: The race and its sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/RaceDetail" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /races/{grand_prix_id}/laps:
    get:
      tags: [races]
      operationId: listRaceLaps
      summary: Lap log for one session of a race.
      description: |
        Source: the `laps` table via `models/laps.model.ts`, ordered by
        `(driver_id, lap_number)`.

        NOTE: the Jolpica ingestion does not write `laps` — it has no
        per-lap telemetry (docs/ingestion/jolpica-ingestion.md §9). An
        ingested race therefore returns an empty page here while still
        returning a full `classification` from `/statistics`.

        A race that exists but has no laps for the requested session returns
        an empty page with HTTP 200; only an unknown `grand_prix_id` is a 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/GrandPrixId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPageDefault100"
        - name: driver_id
          in: query
          required: false
          schema: { type: string }
          example: PIA
        - $ref: "#/components/parameters/SessionType"
      responses:
        "200":
          description: A page of laps.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lap" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /races/{grand_prix_id}/events:
    get:
      tags: [races]
      operationId: listRaceEvents
      summary: Raw event log for one session of a race.
      description: |
        Source: reassembled by `models/events.model.ts` from the decomposed
        event tables (`laps`, `pit_stops`, `position_changes`, `penalties`,
        `retirements`) — there is no single `events` table. Rows are ordered
        by `event_id`.

        The Jolpica ingestion writes `pit_stops` and `retirements`, so an
        ingested race yields PIT_STOP and RETIREMENT events but no
        LAP_COMPLETED or POSITION_CHANGE ones.
      security: []
      parameters:
        - $ref: "#/components/parameters/GrandPrixId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPageDefault100"
        - name: driver_id
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          description: One of the eight event types in docs/event-schema.md §2.
          schema: { $ref: "#/components/schemas/EventType" }
        - $ref: "#/components/parameters/SessionType"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /races/{grand_prix_id}/statistics:
    get:
      tags: [races, statistics]
      operationId: getRaceStatistics
      summary: Derived race statistics and classification.
      description: |
        Runs `services/raceStatistics.ts` over the RACE session's laps and
        events, read from PostgreSQL.

        **Derivation wins; `race_results` is a fallback for missing data.**
        `pit_stop_count`, `overtake_count`, `retirement_count` and `dnf_count`
        are always derived. The other two fields fall back per field:

        - `fastest_lap` — the lap-derived value, or the stored Jolpica
          fastest lap (`race_results.fastest_lap_*`, the row ranked 1) when no
          lap in the session yields one, or `null` when neither exists.
        - `classification` — the derived classification whenever it is
          non-empty, otherwise the `race_results` rows, otherwise `[]`.

        This matters because an ingested season has `race_results` but no
        lap-by-lap log (see docs/ingestion/jolpica-ingestion.md §9), so the
        derivation produces nothing to report and the stored rows are the only
        answer available. Where a lap log does exist, the derived values are
        used and the stored ones are ignored.

        The two sources also differ in fields: the fallback classification
        carries `consistency_ms: null` (consistency needs a lap log) but does
        carry `status`, while the derived classification carries a real
        `consistency_ms` and omits `status` entirely.

        Returns 404 when the race is unknown, or when it exists but has no
        RACE session.
      security: []
      parameters:
        - $ref: "#/components/parameters/GrandPrixId"
      responses:
        "200":
          description: Race statistics.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/RaceStatistics" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /races/{grand_prix_id}/qualifying:
    get:
      tags: [races]
      operationId: getRaceQualifying
      summary: Published qualifying classification for a race.
      description: |
        Source: the `qualifying_results` table via
        `models/qualifyingResults.model.ts`, joined to `drivers` and
        `constructors` for names and ordered by `(position, driver_id)`.
        Written by the Jolpica ingestion; these are published facts, not
        derived statistics.

        A race that exists but has no QUALIFYING session returns 200 with
        `session_id: null` and an empty `classification`; a session with no
        stored rows returns its `session_id` and an empty `classification`.
        Only an unknown `grand_prix_id` is a 404.

        `grand_prix_id` echoes the path parameter as given (the lookup is
        case-insensitive, so it is not normalised).
      security: []
      parameters:
        - $ref: "#/components/parameters/GrandPrixId"
      responses:
        "200":
          description: The qualifying classification.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/RaceQualifying" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
              example:
                data:
                  grand_prix_id: 2025_R13
                  session_id: 2025_R13_QUALIFYING
                  classification:
                    - position: 1
                      driver_id: NOR
                      given_name: Lando
                      family_name: Norris
                      constructor_id: MCL
                      constructor_name: McLaren
                      q1_time_ms: 64962
                      q2_time_ms: 64634
                      q3_time_ms: 63971
                meta: {}
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  /users/me:
    delete:
      tags: [users]
      operationId: deleteCurrentUser
      summary: Delete the authenticated user's account.
      description: |
        Mounted by `routes/users.routes.ts`. Covered by
        `routes/users.routes.test.ts`.

        Requires a **recently issued** token: the request is rejected unless
        the token's `auth_time` is within the last 300 seconds (a 60-second
        tolerance is allowed for clock skew in the other direction). This is a
        re-authentication gate on a destructive, irreversible action.

        Deletion spans Firebase and PostgreSQL, which cannot share one
        transaction, so `services/accountDeletion.ts` records a tombstone
        first and each step is individually idempotent and retryable. A
        pending deletion is retried by `scripts/cleanupAccounts.ts`.

        The tombstone is retained permanently so a deleted Firebase UID cannot
        recreate its profile using an ID token that stays briefly valid after
        the Auth user is removed.
      responses:
        "204":
          description: |
            Deletion completed synchronously. No body.
        "202":
          description: |
            Deletion was recorded but could not be completed on this request;
            a retry will finish it.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [status]
                    additionalProperties: false
                    properties:
                      status:
                        type: string
                        const: deletion_pending
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
              example:
                data: { status: deletion_pending }
                meta: {}
        "401":
          description: |
            Either no valid Firebase ID token was supplied (code
            `UNAUTHENTICATED`, from `middleware/authenticate.ts`), or the
            token is too old for a destructive action (code
            `RECENT_LOGIN_REQUIRED`). Both use the standard envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              example:
                error:
                  code: RECENT_LOGIN_REQUIRED
                  message: Sign in again before deleting your account.
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # /submissions — the submission workflow. Every route requires
  # authentication: `authenticate` is applied to the whole router in
  # routes/submissions.routes.ts before any per-route authorization.
  #
  # All five routes (GET and POST /submissions, GET /submissions/mine, and
  # GET and PATCH /submissions/{submission_id}) are covered by
  # routes/submissions.routes.test.ts, per src/backend/CLAUDE.md ("Every new
  # endpoint needs a Supertest test in src/routes/").
  # ---------------------------------------------------------------------------
  /submissions:
    get:
      tags: [submissions]
      operationId: listSubmissions
      summary: List submissions visible to the caller.
      description: |
        An ADMIN sees every submission; an approved SUBMITTER sees only their
        own. Both the ownership and `status` filters are applied in SQL by
        `models/submissions.model.ts` `findAll`, newest first
        (`submitted_at DESC, submission_id DESC`).

        The query is validated by `listSchema` in
        controllers/submissions.controller.ts, a strict object: `status` is
        the only accepted parameter, and any other parameter (including
        `page` or `per_page`) is a 400 VALIDATION_ERROR.

        TODO(discrepancy): docs/api-design.md §7.2 also specifies a
        `submitted_by` filter and "Paginated per §5". Neither is implemented
        — every visible row is returned unpaginated, and `meta` is `{}`
        rather than a pagination object. docs §5 also lists `/submissions`
        among the endpoints accepting `page`/`per_page`; it does not.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Only return submissions in this state. Lowercase, matching the
            `status` field of SubmissionRecord; the controller uppercases it
            to the stored `submission_status` enum.
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: All submissions visible to the caller. Unpaginated.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubmissionRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }

    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit one event for review.
      description: |
        Requires ADMIN, or SUBMITTER with `submitter_status = APPROVED`.
        Persists to the `submissions` table with `status = 'PENDING'`, after
        upserting the caller into the `users` table from their verified token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { $ref: "#/components/schemas/SubmissionEvent" }
      responses:
        "201":
          description: Submission created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/SubmissionRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "500":
          description: |
            Returned when the event references a `session_id` absent from the
            `sessions` table: the INSERT violates a foreign key, the driver
            error escapes `models/submissions.model.ts` uncaught, and
            `errorHandler` maps it to a generic INTERNAL_ERROR.

            TODO(discrepancy): docs/api-design.md §7.1 lists only
            VALIDATION_ERROR (400) and FORBIDDEN (403) for this endpoint. An
            unknown `session_id` is a client mistake surfacing as a 500.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }

  /submissions/mine:
    get:
      tags: [submissions]
      operationId: listMySubmissions
      summary: List the caller's own submissions.
      description: |
        Requires a valid Firebase ID token but **no role**: any signed-in
        user may call it, so a submitter whose role is later revoked can
        still see their history. Mounted before `/submissions/{submission_id}`
        in routes/submissions.routes.ts, so `mine` is never parsed as an id.

        Returns every submission owned by the caller, newest first
        (`submitted_at DESC, submission_id DESC`). Unpaginated, so `meta` is
        `{}`. The query is strict: any parameter other than `status` is a 400.
      parameters:
        - name: status
          in: query
          required: false
          description: Only return submissions in this state.
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: The caller's submissions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SubmissionRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }

  /submissions/{submission_id}:
    get:
      tags: [submissions]
      operationId: getSubmission
      summary: Fetch one submission.
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: The submission.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/SubmissionRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400":
          description: |
            `submission_id` is not a positive integer. Uses the standard
            envelope (raised via `ApiError.validationError`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403":
          description: |
            A non-admin requesting someone else's submission. Note this 403
            uses the **standard** envelope (`ApiError.forbidden`), unlike the
            role-gate 403 from the authorization middleware.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [submissions]
      operationId: reviewSubmission
      summary: Accept or reject a pending submission. ADMIN only.
      description: |
        Transitions `PENDING → ACCEPTED | REJECTED`. The UPDATE is guarded by
        `AND status = 'PENDING'`, so a second review affects no rows and is
        reported as a 409.

        TODO(discrepancy): accepting a submission records the review but does
        **not** apply the event to any table — nothing writes to `laps`,
        `pit_stops`, `position_changes`, `penalties` or `retirements`. An
        accepted submission therefore never reaches the read endpoints, even
        though those now read the same tables the event would be written to.
        docs/api-design.md does not state either way what acceptance does.
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                validation_errors:
                  type: array
                  default: []
                  items: { type: string, minLength: 1 }
                  description: |
                    Required to be non-empty when `status` is `rejected`
                    (otherwise 400 "A rejection reason is required.").

                    TODO(discrepancy): only the FIRST element is persisted —
                    the `submissions` table has a single `validation_message
                    TEXT` column, and the controller passes
                    `validation_errors[0] ?? null`. Every element after the
                    first is silently discarded, and reads back as a
                    one-element array. docs/api-design.md §7.4 presents this
                    as an unbounded list.
      responses:
        "200":
          description: The reviewed submission.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/SubmissionRecord" }
                  meta: { $ref: "#/components/schemas/EmptyMeta" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already reviewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
              example:
                error:
                  code: SUBMISSION_ALREADY_REVIEWED
                  message: This submission has already been reviewed.

# =============================================================================
components:
# =============================================================================

  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token, verified server-side with
        `firebase-admin`'s `verifyIdToken()`. The caller's `role` and
        `submitter_status` are then read from the Firestore document
        `users/{uid}` — **not** from the PostgreSQL `users` table.

        TODO(discrepancy): docs/api-design.md §8.5 states "`role` and
        `submitter_status` live in the backend's own `users` table
        (`database/schema.sql`), not in Firestore." The implementation does
        the opposite: `middleware/authenticate.ts` reads both from Firestore,
        and `models/submissions.model.ts` copies them INTO Postgres on each
        write. Nothing ever reads the Postgres `role` column back.

  # ---------------------------------------------------------------------------
  parameters:

    Page:
      name: page
      in: query
      required: false
      description: |
        1-indexed. Coerced from string. `0`, a negative value, or a
        non-numeric value is a 400 VALIDATION_ERROR. A page beyond
        `total_pages` returns 200 with an empty `data` array.
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageDefault20:
      name: per_page
      in: query
      required: false
      description: |
        Values above 100 are **clamped to 100, not rejected** (docs §5;
        `utils/pagination.ts` `clampPerPage`). Values below 1 ARE rejected as
        a 400 VALIDATION_ERROR. The clamped value is what appears in
        `meta.per_page` and what `meta.total_pages` is computed from.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PerPageDefault100:
      name: per_page
      in: query
      required: false
      description: |
        As above, but defaulting to 100 — a session's log is larger than a
        page of drivers or races. Still clamped at 100, so the default is
        also the maximum here.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100

    SessionType:
      name: session_type
      in: query
      required: false
      description: Defaults to `RACE` when omitted.
      schema:
        allOf:
          - $ref: "#/components/schemas/SessionType"
        default: RACE

    ConstructorId:
      name: constructor_id
      in: path
      required: true
      description: |
        Matched case-insensitively against the `constructors` table — same
        convention as `DriverId` below.
      schema: { type: string }
      example: MCL

    DriverId:
      name: driver_id
      in: path
      required: true
      description: |
        Matched case-insensitively — `/drivers/ver` and `/drivers/VER` both
        resolve, and the canonical uppercase id is echoed in the response.

        TODO(discrepancy): docs/api-design.md documents no case-insensitive
        lookup for either identifier. It is implementation behaviour asserted
        by routes/statistics.routes.test.ts ("resolves a lowercase driver id
        to its canonical form").
      schema: { type: string }
      example: PIA

    GrandPrixId:
      name: grand_prix_id
      in: path
      required: true
      description: |
        Format `{season}_R{round}` with the round **zero-padded to two
        digits** — `2025_R01`, `2025_R09`, `2025_R13`. Built by
        `utils/identifiers.ts` `toGrandPrixId()` and stored as a real column,
        so the padded form is what the database holds and what this parameter
        must be given. Matched case-insensitively.
      schema: { type: string }
      example: 2025_R13

    SubmissionId:
      name: submission_id
      in: path
      required: true
      description: |
        Positive integer. Validated in the controller (not by Zod); a
        non-integer or non-positive value is a 400 VALIDATION_ERROR.
      schema:
        type: integer
        minimum: 1

  # ---------------------------------------------------------------------------
  responses:

    ValidationError:
      description: |
        Query params or request body failed validation. Message format for
        query failures is `Invalid query parameter '<field>': <reason>`
        (utils/queryValidation.ts).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
          example:
            error:
              code: VALIDATION_ERROR
              message: "Invalid query parameter 'season': Invalid input"

    NotFound:
      description: |
        Resource does not exist. Also returned by `notFoundHandler` for any
        unmatched route, with the message
        `No route matches <METHOD> <originalUrl>`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
          example:
            error:
              code: NOT_FOUND
              message: "Driver 'ZZZ' was not found."

    AuthError:
      description: |
        Authentication or authorization failure, raised as an `ApiError` by
        `middleware/authenticate.ts` and `middleware/authorization.ts` and
        rendered by `errorHandler` in the standard envelope.

        401 `UNAUTHENTICATED`: "Firebase ID token required." / "Invalid or
        expired Firebase token." / "No Firestore user profile exists." /
        "Authentication required."

        403 `FORBIDDEN`: "Administrator access required." / "Approved
        submitter or administrator access required." / "Account deletion has
        been requested." / "Account deletion is in progress."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
          example:
            error:
              code: UNAUTHENTICATED
              message: Firebase ID token required.

  # ---------------------------------------------------------------------------
  schemas:

    # -- Envelopes ----------------------------------------------------------
    # types/api.types.ts

    PaginationMeta:
      type: object
      required: [page, per_page, total_items, total_pages]
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages:
          type: integer
          minimum: 0
          description: |
            `Math.ceil(total_items / per_page)` — therefore `0` when
            `total_items` is 0, not 1.
      example: { page: 1, per_page: 20, total_items: 20, total_pages: 1 }

    EmptyMeta:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: |
        `{}` on every single-resource response. Typed in api.types.ts as
        `Record<string, never>`.

    ApiErrorBody:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Codes actually emitted by the running server:
                VALIDATION_ERROR (400, including a request body that is not
                valid JSON), UNAUTHENTICATED (401), RECENT_LOGIN_REQUIRED
                (401), FORBIDDEN (403: role checks, account deletion,
                submission ownership, and a CORS-rejected origin), NOT_FOUND
                (404), SUBMISSION_ALREADY_REVIEWED (409), RATE_LIMITED (429,
                /chat only), INTERNAL_ERROR (500), BAD_GATEWAY (502, /chat)
                and SERVICE_UNAVAILABLE (503, /chat).

                TODO(discrepancy): docs/api-design.md §7 also defines
                SUBMITTER_NOT_APPROVED (403). It is not reachable: an
                unapproved submitter gets FORBIDDEN.
            message: { type: string }

    # -- Chat ----------------------------------------------------------------
    # controllers/chat.controller.ts, chat/assistant.ts

    ChatRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            The conversation so far, oldest first. The last message must be
            from the user. Earlier assistant replies may be included for
            context.
          items:
            type: object
            required: [role, content]
            additionalProperties: false
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 1000
                description: Trimmed before validation; whitespace-only is rejected.

    ChatReply:
      type: object
      required: [reply, tools_used]
      additionalProperties: false
      properties:
        reply:
          type: string
          description: The assistant's answer, as plain text.
        tools_used:
          type: array
          description: |
            Tools that ran successfully while answering, in first-use order,
            without repeats. Empty when the model answered without data
            (for example, declining an off-topic question).
          items:
            type: string
            enum:
              [search_drivers, search_races, get_driver_stats,
               get_constructor_standings, get_race_summary, get_race_events,
               get_export_link]

    # -- Drivers -------------------------------------------------------------
    # types/driver.types.ts

    DriverRecord:
      type: object
      required:
        [driver_id, permanent_number, given_name, family_name, nationality,
         date_of_birth, constructor_id, constructor_name]
      additionalProperties: false
      properties:
        driver_id: { type: string, example: VER }
        permanent_number: { type: integer, example: 1 }
        given_name: { type: string, example: Max }
        family_name: { type: string, example: Verstappen }
        nationality: { type: string, example: Dutch }
        date_of_birth:
          type: string
          format: date
          example: "1997-09-30"
        constructor_id: { type: string, example: RBR }
        constructor_name:
          type: string
          description: |
            Joined from the `constructors` table. `models/constructors.model.ts`
            falls back to the `constructor_id` itself when no row matches,
            rather than throwing.
          example: Red Bull Racing

    DriverStatistics:
      description: Output of `services/driverStatistics.ts`.
      type: object
      required:
        [driver_id, season, races_entered, wins, podiums, dnf_count, dnf_rate,
         fastest_laps, average_finish_position, average_race_pace_ms, points,
         positions_gained_lost_avg]
      additionalProperties: false
      properties:
        driver_id: { type: string }
        season:
          type: string
          description: Echoed back verbatim from the query param.
        races_entered:
          type: integer
          description: |
            Sessions where the driver appears in the lap or event log, OR has
            an ingested `race_results` row for that session (see `points`
            below) — the latter covers a Jolpica-ingested race with no
            lap-by-lap telemetry at all.
        wins:
          type: integer
          description: |
            Sessions where the driver's finishing position was 1. The position
            is lap-derived when the driver has laps; otherwise it falls back to
            that session's classified `race_results.position` (see
            `average_finish_position`). A driver with neither counts no win.
        podiums:
          type: integer
          description: |
            Sessions where the driver's finishing position was 3 or better,
            from the same lap-derived-then-stored position as `wins`.
        dnf_count:
          type: integer
          description: Sessions containing a RETIREMENT event for this driver.
        dnf_rate:
          type: [number, "null"]
          description: |
            `dnf_count / races_entered`, rounded to 4 dp. `null` when
            `races_entered` is 0 — "no data" and "a rate of zero" are
            distinguished.
        fastest_laps:
          type: integer
          description: |
            Sessions where this driver set the quickest racing lap. Derived
            across all drivers' laps, deliberately NOT read from the
            FASTEST_LAP_SET event.

            Fallback: only for a session in which NO driver has any laps, the
            driver holding the published `race_results.fastest_lap_rank = 1`
            is credited instead. If any driver has laps, the derived answer
            stands and the stored flag is ignored.
        average_finish_position:
          type: [number, "null"]
          description: |
            Rounded to 2 dp. `null` when no position was recorded.

            Each session's position is the driver's position on their last
            recorded lap. Only when the driver has no laps in that session does
            it fall back to the session's classified `race_results.position`
            (a published fact from Jolpica, like `points` - a deliberate,
            narrow exception to "statistics are derived"; see
            docs/ingestion/jolpica-ingestion.md §4.2). The raw nullable column
            is used: an unclassified driver (retired, disqualified, did not
            start) has no position and contributes no finish, rather than an
            invented one. Laps always take precedence when present.
        average_race_pace_ms:
          type: [integer, "null"]
          description: |
            Mean lap time in whole ms over valid, non-pit, timed laps, pooled
            across the season. `null` when no such laps exist.

            Known limitation recorded in services/lapStatistics.ts: the event
            schema has no safety-car flag, so safety-car laps are included
            and inflate this figure.
        points:
          type: [number, "null"]
          description: |
            Per session, prefers that session's ingested `race_results.points`
            when a row exists for this driver — a deliberate, narrow exception
            to "statistics are derived": Jolpica writes `points` straight from
            the source and it already applies era/sprint/half-point rules
            `services/pointsTable.ts` does not implement
            (docs/ingestion/jolpica-ingestion.md §4.2). Falls back to
            `pointsForPosition()` (`services/pointsTable.ts`) on the derived
            finishing position only for a session with no ingested row at all.
            Summed across the season per docs/f1-statistics.md §3.

            `null` — not `0` — when NEITHER source produced anything for the
            whole season, so "scored nothing" and "no data" stay distinct. A
            session backed only by an ingested row, with no lap or event log,
            still counts toward `races_entered` and contributes its stored
            points. Its finishing position, if classified, also feeds
            `average_finish_position`, `wins` and `podiums` via the fallback
            described there.

            KNOWN LIMITATION: the derived fallback only implements the base
            P1–P10 race scale — no fastest-lap bonus point, no separate sprint
            scale. This no longer matters once a race is fully ingested, since
            its `race_results.points` is used instead; it still applies to a
            session with neither a lap log nor an ingested result.
        positions_gained_lost_avg:
          type: [number, "null"]
          description: |
            Average of (grid position − finishing position) across every
            session where both are derivable, rounded to 2 dp. Positive means
            the driver typically gained places. `null` when no session had
            both.

            The grid comes from the grand prix's QUALIFYING session events
            when they exist. Otherwise it falls back to the driver's
            `race_results.grid_position` for that race, which is the only
            source for Jolpica-ingested races since no QUALIFYING session is
            ingested. A stored grid of `0` (a pit-lane start) is skipped, not
            guessed at. The finishing position is lap-derived, then stored, as
            for `average_finish_position`.

            SIGN CONVENTION: this implements docs/f1-statistics.md §2
            (`grid − finish`). §3's "qualifying-vs-race performance" defines
            the same comparison with the opposite sign; negate this to read it
            that way.

    ConstructorStatistics:
      description: Output of `services/constructorStatistics.ts`.
      type: object
      required: [constructor_id, season, points]
      additionalProperties: false
      properties:
        constructor_id: { type: string }
        season:
          type: string
          description: Echoed back verbatim from the query param.
        points:
          type: [number, "null"]
          description: |
            Sum of both registered drivers' `DriverStatistics.points` for the
            season, per docs/f1-statistics.md §3 — not a separately-scored
            total. A driver with no derivable points contributes 0, not
            `null`, to this sum; the total is `null` only when NEITHER
            registered driver has any points to contribute (same convention
            as `DriverStatistics.points`).

    # -- Exports -------------------------------------------------------------
    # models/exports.model.ts, controllers/exports.controller.ts

    ExportMeta:
      type: object
      required: [dataset, season, row_count, generated_at]
      additionalProperties: false
      properties:
        dataset:
          type: string
          enum: [races, drivers, constructors, results, laps]
        season:
          type: [string, "null"]
          description: The `season` filter applied, or `null` when none was.
        row_count: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }

    ConstructorRecord:
      description: A `constructors` table row (types/driver.types.ts `Constructor`).
      type: object
      required: [constructor_id, name, nationality]
      additionalProperties: false
      properties:
        constructor_id: { type: string, example: MCL }
        name: { type: string, example: McLaren }
        nationality: { type: [string, "null"], example: British }

    ResultExportRow:
      description: |
        One `race_results` row joined to its session and grand prix. Covers
        every session type with a classification (RACE and SPRINT).
        `position` is as stored — `null` for an unclassified driver.
      type: object
      required:
        [season_id, round, grand_prix_id, race_name, session_id, session_type,
         position, driver_id, constructor_id, grid_position, laps_completed,
         pit_stops, status, points, gap_to_winner_ms, fastest_lap_rank,
         fastest_lap_number, fastest_lap_time_ms]
      additionalProperties: false
      properties:
        season_id: { type: string }
        round: { type: integer }
        grand_prix_id: { type: string }
        race_name: { type: string }
        session_id: { type: string }
        session_type: { $ref: "#/components/schemas/SessionType" }
        position: { type: [integer, "null"] }
        driver_id: { type: string }
        constructor_id: { type: string }
        grid_position: { type: [integer, "null"] }
        laps_completed: { type: integer }
        pit_stops: { type: integer }
        status: { $ref: "#/components/schemas/ResultStatus" }
        points: { type: number }
        gap_to_winner_ms: { type: [integer, "null"] }
        fastest_lap_rank: { type: [integer, "null"] }
        fastest_lap_number: { type: [integer, "null"] }
        fastest_lap_time_ms: { type: [integer, "null"] }

    LapExportRow:
      description: One `laps` row joined to its session and grand prix.
      type: object
      required:
        [season_id, round, grand_prix_id, session_id, session_type, driver_id,
         lap_number, lap_time_ms, position, is_pit_lap, is_valid]
      additionalProperties: false
      properties:
        season_id: { type: string }
        round: { type: integer }
        grand_prix_id: { type: string }
        session_id: { type: string }
        session_type: { $ref: "#/components/schemas/SessionType" }
        driver_id: { type: string }
        lap_number: { type: integer, minimum: 1 }
        lap_time_ms: { type: [integer, "null"] }
        position: { type: [integer, "null"] }
        is_pit_lap: { type: boolean }
        is_valid: { type: boolean }

    # -- Races ---------------------------------------------------------------
    # types/race.types.ts

    Race:
      type: object
      required:
        [grand_prix_id, season_id, round, race_name, circuit_id, circuit_name,
         locality, country, date, has_sprint]
      properties:
        grand_prix_id: { type: string, example: 2025_R13 }
        season_id: { type: string, example: "2025" }
        round: { type: integer, example: 13 }
        race_name: { type: string, example: Belgian Grand Prix }
        circuit_id: { type: string, example: spa }
        circuit_name:
          type: string
          example: Circuit de Spa-Francorchamps
        locality: { type: string, example: Spa }
        country: { type: string, example: Belgium }
        date: { type: string, format: date, example: "2025-07-27" }
        has_sprint: { type: boolean }

    RaceListItem:
      allOf:
        - $ref: "#/components/schemas/Race"
        - type: object
          required: [has_results]
          properties:
            has_results:
              type: boolean
              description: |
                True when at least one session exists for the race, i.e. when
                a `/statistics` call will return 200 rather than 404. True for
                exactly one of the 24 sample races.

    RaceDetail:
      allOf:
        - $ref: "#/components/schemas/Race"
        - type: object
          required: [sessions]
          properties:
            sessions:
              type: array
              items: { $ref: "#/components/schemas/Session" }

    Session:
      # types/session.types.ts
      type: object
      required: [session_id, grand_prix_id, type, total_laps, start_time, end_time]
      additionalProperties: false
      properties:
        session_id: { type: string, example: 2025_R13_RACE }
        grand_prix_id:
          type: string
          description: |
            TODO(discrepancy): docs/api-design.md §4.5's example session object
            shows only `session_id`, `type`, `total_laps`, `start_time` and
            `end_time`. The implementation returns the full `Session` row from
            types/session.types.ts, which also carries `grand_prix_id` —
            redundant inside a race detail response, but present.
        type: { $ref: "#/components/schemas/SessionType" }
        total_laps: { type: [integer, "null"], example: 44 }
        start_time:
          type: [string, "null"]
          format: date-time
          description: |
            Taken from the SESSION_START event's timestamp, not a stored
            column — `null` when that event has no timestamp.
        end_time:
          type: [string, "null"]
          format: date-time
          description: From the SESSION_END event's timestamp.

    ResultStatus:
      description: |
        Mirrors the `result_status` enum in database/schema.sql. The Jolpica
        ingestion folds "Did not start" into `DNF`
        (docs/ingestion/jolpica-ingestion.md §4.5), so no DNS value exists.
      type: string
      enum: [FINISHED, DNF, DSQ]

    SessionType:
      type: string
      enum:
        [PRACTICE_1, PRACTICE_2, PRACTICE_3, QUALIFYING, SPRINT_QUALIFYING,
         SPRINT, RACE]

    # -- Laps and events -----------------------------------------------------
    # types/lap.types.ts, types/event.types.ts

    Lap:
      type: object
      required:
        [session_id, driver_id, lap_number, position, lap_time_ms, is_pit_lap,
         is_valid]
      additionalProperties: false
      properties:
        session_id: { type: string, example: 2025_R13_RACE }
        driver_id: { type: string, example: PIA }
        lap_number: { type: integer, minimum: 1 }
        position: { type: [integer, "null"] }
        lap_time_ms: { type: [integer, "null"], example: 108250 }
        is_pit_lap: { type: boolean }
        is_valid:
          type: boolean
          description: |
            False for a deleted lap (e.g. track limits). Maps directly to
            `laps.is_valid`, which defaults to TRUE.

    EventType:
      type: string
      enum:
        [SESSION_START, SESSION_END, LAP_COMPLETED, PIT_STOP, POSITION_CHANGE,
         PENALTY_ISSUED, RETIREMENT, FASTEST_LAP_SET]

    Event:
      type: object
      required: [event_id, session_id, type, timestamp, payload]
      additionalProperties: false
      properties:
        event_id: { type: string, example: evt_004 }
        session_id: { type: string, example: 2025_R13_RACE }
        driver_id:
          type: string
          description: |
            **Key omitted entirely** — not set to null — when absent, per
            docs/event-schema.md §3 ("Not present on
            SESSION_START/SESSION_END"). See models/events.model.ts `toEvent`.
        type: { $ref: "#/components/schemas/EventType" }
        lap_number:
          type: integer
          description: Key omitted entirely when absent, as with `driver_id`.
        timestamp:
          type: [string, "null"]
          format: date-time
          description: |
            TODO(discrepancy): docs/event-schema.md §3 marks `timestamp`
            REQUIRED, and every example in docs/api-design.md §4.7 shows one.
            None of the decomposed event tables (`laps`, `pit_stops`,
            `position_changes`, `penalties`, `retirements`) stores a per-event
            timestamp, so `models/events.model.ts` emits `null` for every
            event. types/event.types.ts records this as an open question —
            either the schema needs the column or the contract needs to mark
            the field nullable.
        payload:
          description: |
            Shape varies by `type`. Typed as a union in
            types/event.types.ts but **not validated at read time** — the
            model casts the raw JSON with `as EventPayload`. Services that
            consume payloads re-check fields at runtime
            (services/pitStatistics.ts, services/runningOrder.ts) precisely
            because this cast guarantees nothing.
          oneOf:
            - title: LAP_COMPLETED
              type: object
              required: [lap_time_ms, position, is_pit_lap, is_valid]
              properties:
                lap_time_ms: { type: integer }
                position: { type: integer }
                is_pit_lap: { type: boolean }
                is_valid: { type: boolean }
            - title: PIT_STOP
              type: object
              required: [duration_ms]
              properties:
                duration_ms: { type: integer }
                tyre_in: { type: string }
                tyre_out: { type: string }
              description: |
                TODO(discrepancy): docs/event-schema.md documents `tyre_in`
                and `tyre_out` as part of this payload, but the `pit_stops`
                table has no tyre columns, so a PIT_STOP event can only ever
                carry `duration_ms`. types/event.types.ts marks both optional
                rather than claiming a guarantee the schema cannot meet.
            - title: POSITION_CHANGE
              type: object
              required: [overtaken_driver_id, position_before, position_after]
              properties:
                overtaken_driver_id: { type: string }
                position_before: { type: integer }
                position_after: { type: integer }
            - title: PENALTY_ISSUED
              type: object
              required: [penalty_type, duration_ms, reason]
              properties:
                penalty_type:
                  type: string
                  enum: [TIME, GRID_DROP, DISQUALIFICATION]
                duration_ms: { type: [integer, "null"] }
                reason: { type: string }
            - title: RETIREMENT
              type: object
              required: [reason]
              properties:
                reason: { type: string }
            - title: FASTEST_LAP_SET
              type: object
              required: [lap_time_ms]
              properties:
                lap_time_ms: { type: integer }
            - title: SESSION_START / SESSION_END
              type: object
              maxProperties: 0
              description: Empty payload.

    # -- Race statistics -----------------------------------------------------

    RaceStatisticsBase:
      type: object
      required:
        [grand_prix_id, session_id, total_laps, fastest_lap, pit_stop_count,
         overtake_count, retirement_count, dnf_count, classification]
      properties:
        grand_prix_id: { type: string, example: 2025_R13 }
        session_id: { type: string, example: 2025_R13_RACE }
        total_laps: { type: [integer, "null"], example: 44 }
        pit_stop_count:
          type: integer
          description: |
            Count of PIT_STOP events in the session. Genuinely derived in both
            branches.

            TODO(discrepancy): docs/api-design.md §4.8's worked example shows
            `"pit_stop_count": 1` for 2025_R13. The implementation derives 3
            from the sample event log, which is what
            routes/statistics.routes.test.ts asserts. The doc's example is
            stale.
        overtake_count:
          type: integer
          description: Count of POSITION_CHANGE events. Derived in both branches.
        retirement_count:
          type: integer
          description: Count of RETIREMENT events. Derived in both branches.
        dnf_count:
          type: integer
          description: |
            Currently identical to `retirement_count` — the same derivation.
            Reported separately because a DISQUALIFICATION penalty would
            raise this without being a retirement.

    RaceStatistics:
      description: |
        The single shape this endpoint returns. `fastest_lap` and
        `classification` are filled from the derivation where it produced
        something, and from `race_results` otherwise — see the endpoint
        description. The counts in `RaceStatisticsBase` are always derived.
      allOf:
        - $ref: "#/components/schemas/RaceStatisticsBase"
        - type: object
          properties:
            fastest_lap:
              type: [object, "null"]
              description: |
                `null` when neither a lap-derived nor a stored fastest lap
                exists. Ties in the derivation are broken by the earlier
                `lap_number`.

                TODO(discrepancy): **the two sources use different field names
                for the same value.** The lap-derived value
                (`services/lapStatistics.ts` `FastestLap`) calls it
                `lap_time_ms`; the stored Jolpica value
                (`models/raceResults.model.ts` `FastestLapData`) calls it
                `time_ms`. Which one appears depends on which source answered,
                so a client must handle both — the frontend does, at
                `src/frontend/src/data/f1Data.ts`
                (`fastest_lap.time_ms ?? fastest_lap.lap_time_ms`).
                docs/api-design.md §4.8 documents only `lap_time_ms`.
              oneOf:
                - title: Lap-derived
                  type: object
                  required: [driver_id, lap_number, lap_time_ms]
                  additionalProperties: false
                  properties:
                    driver_id: { type: string }
                    lap_number: { type: integer }
                    lap_time_ms: { type: integer }
                - title: Stored (Jolpica)
                  type: object
                  required: [driver_id, lap_number, time_ms]
                  additionalProperties: false
                  properties:
                    driver_id: { type: string, example: ANT }
                    lap_number: { type: integer, example: 32 }
                    time_ms:
                      type: integer
                      example: 104861
                      description: |
                        Parsed from Jolpica's formatted `FastestLap.Time.time`
                        (`"1:22.167"`) at ingest time. Taken from the
                        `race_results` row whose `fastest_lap_rank` is 1.
            classification:
              type: array
              description: |
                Empty when neither source has rows.

                In the derived case, positions are reported exactly as derived
                from each driver's last recorded lap and are deliberately NOT
                renumbered into a contiguous 1..N — with a partial lap log that
                would invent a classification the data does not support.
                Drivers with no derivable position are omitted entirely.

                In the fallback case, rows come from `race_results` ordered by
                `position` (NULLs last), then `driver_id`.
              items:
                type: object
                required:
                  [position, driver_id, constructor_id, laps, pit_stops,
                   consistency_ms, gap_to_winner_ms]
                additionalProperties: false
                properties:
                  position: { type: integer, minimum: 1 }
                  driver_id: { type: string }
                  constructor_id:
                    type: [string, "null"]
                    description: |
                      `null` only in the derived case, when the driver is
                      absent from the constructor lookup. Always a string in
                      the `race_results` fallback, where it is a foreign key.
                  laps:
                    type: integer
                    description: |
                      Derived: the driver's last recorded lap number. Fallback:
                      `race_results.laps_completed`.
                  pit_stops: { type: integer }
                  consistency_ms:
                    type: [integer, "null"]
                    description: |
                      Population standard deviation of the driver's racing lap
                      times (`services/lapStatistics.ts` `lapConsistency`).
                      Always `null` in the `race_results` fallback — consistency
                      cannot be computed without a lap log.
                  gap_to_winner_ms:
                    type: [integer, "null"]
                    description: |
                      Derived: `null` unless EVERY classified driver has a
                      complete lap log for all `total_laps` — deliberately,
                      rather than presenting a plausible figure derived from
                      partial data. Fallback: `race_results.gap_to_winner_ms`,
                      which the Jolpica ingest computes against the winner's
                      absolute time and leaves `null` for lapped or retired
                      drivers.

                      TODO(discrepancy): docs/api-design.md §4.8 shows
                      `"gap_to_winner_ms": 0` with no mention that the field is
                      nullable.
                  status:
                    $ref: "#/components/schemas/ResultStatus"
                    description: |
                      Present **only** in the `race_results` fallback, where it
                      is the stored `result_status`. The lap-derived
                      classification omits the key entirely — a lap log alone
                      cannot distinguish a retirement from a lapped finisher,
                      which is the ambiguity this field resolves for ingested
                      races.

    # -- Submissions ---------------------------------------------------------
    # types/submission.types.ts

    RaceQualifying:
      description: |
        Response of GET /races/{grand_prix_id}/qualifying:
        `QualifyingData` from models/qualifyingResults.model.ts plus the
        requested `grand_prix_id`.
      type: object
      required: [grand_prix_id, session_id, classification]
      additionalProperties: false
      properties:
        grand_prix_id: { type: string, example: 2025_R13 }
        session_id:
          type: [string, "null"]
          description: The QUALIFYING session, or null when the race has none.
        classification:
          type: array
          items: { $ref: "#/components/schemas/QualifyingClassificationRow" }

    QualifyingClassificationRow:
      type: object
      required:
        [position, driver_id, given_name, family_name, constructor_id,
         constructor_name, q1_time_ms, q2_time_ms, q3_time_ms]
      additionalProperties: false
      properties:
        position: { type: integer, minimum: 1 }
        driver_id: { type: string, example: NOR }
        given_name: { type: string }
        family_name: { type: string }
        constructor_id: { type: string, example: MCL }
        constructor_name: { type: string }
        q1_time_ms:
          type: [integer, "null"]
          minimum: 1
          description: Null when the driver set no Q1 time.
        q2_time_ms:
          type: [integer, "null"]
          minimum: 1
          description: Null when the driver did not reach or set a time in Q2.
        q3_time_ms:
          type: [integer, "null"]
          minimum: 1
          description: Null when the driver did not reach or set a time in Q3.

    SubmissionEvent:
      type: object
      required: [event_id, session_id, type, timestamp, payload]
      properties:
        event_id: { type: string, minLength: 1 }
        session_id:
          type: string
          minLength: 1
          description: |
            Must reference an existing row in the `sessions` table — enforced
            by a foreign key, not by request validation. See the 500 response
            on POST /submissions.
        driver_id: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/EventType" }
        lap_number: { type: integer, minimum: 1 }
        timestamp:
          type: string
          format: date-time
          description: |
            Validated with Zod's `.datetime()` — strict ISO 8601. Required on
            submission, unlike the nullable `timestamp` on read
            (`Event.timestamp`), so the write path enforces what the read
            path cannot supply.
        payload:
          type: object
          additionalProperties: true
          description: |
            Accepted as an arbitrary object (`z.record(z.string(),
            z.unknown())`). The per-type payload shapes in
            docs/event-schema.md are NOT enforced on submission — a
            LAP_COMPLETED event with an empty payload is stored happily.

    SubmissionRecord:
      description: |
        Output of `toApiRecord` in controllers/submissions.controller.ts. The
        stored columns `submitter_user_id`, `session_id` and
        `validation_message` are not exposed directly.

        Identity fields are redacted per viewer: `submitted_by` and
        `submitted_by_email` are `null` unless the caller is an ADMIN or the
        submitter; `reviewed_by` and `reviewed_by_email` are `null` unless
        the caller is an ADMIN.
      type: object
      required:
        [submission_id, submitted_by, submitted_by_email, submitted_at,
         reviewed_at, reviewed_by, reviewed_by_email, status,
         validation_errors, event]
      additionalProperties: false
      properties:
        submission_id: { type: integer, example: 42 }
        submitted_by:
          type: [string, "null"]
          description: The submitter's Firebase uid, or null when redacted.
        submitted_by_email: { type: [string, "null"] }
        submitted_at: { type: string, format: date-time }
        reviewed_at:
          type: [string, "null"]
          format: date-time
          description: Null while the submission is pending.
        reviewed_by:
          type: [string, "null"]
          description: The reviewing admin's Firebase uid. ADMIN viewers only.
        reviewed_by_email:
          type: [string, "null"]
          description: The reviewing admin's email. ADMIN viewers only.
        status:
          type: string
          enum: [pending, accepted, rejected]
          description: |
            Lowercased on output. Stored uppercase in Postgres
            (`submission_status` enum: PENDING/ACCEPTED/REJECTED) and typed
            uppercase in types/submission.types.ts; the controller lowercases
            it to match docs §7.1. Request bodies use the lowercase form.
        validation_errors:
          type: array
          maxItems: 1
          items: { type: string }
          description: |
            `[validation_message]` when set, `[]` otherwise — therefore never
            longer than one element. See the TODO on PATCH's request body.
        event:
          allOf:
            - $ref: "#/components/schemas/SubmissionEvent"
          description: |
            The `event_data` JSONB column, echoed back exactly as submitted.
